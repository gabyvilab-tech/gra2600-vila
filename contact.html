<!DOCTYPE html>
<html lang="en">
<head>       
  <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact Gabriela Vila</title>
  <link rel="stylesheet" href="css/style.css">

<body>

 
<!-- PAGE TOP: filled in from includes/header.html -->
<div id="page-top"></div>

<h1>Contact me</h1>

<form action=" https://formspree.io/f/myewejjj" method="POST" id="contact-form">

  <p><label for="first-name">First Name</label><input type="text" id="first-name" name="first-name"></p>
<p><label for="last-name">Last Name</label><input type="text" id="last-name" name="last-name"></p>
<p><label for="email">Email</label><input type="email" id="email" name="email" required></p>
<p><label for="phone">Phone</label><input type="tel" id="phone" name="phone" class="phone"></p>
<p><label for="message">Message</label><textarea id="message" name="message" rows="6" cols="40"></textarea></p>
<p><button type="submit">Send Message</button></p>

<p>How do you prefer to be contacted?</p>

<label class="radio-option">
  <input type="radio" name="contact-method" value="email" checked>
  Email
</label>
<label class="radio-option">
  <input type="radio" name="contact-method" value="phone">
  Phone
</label>

</form>

  <p>Follow me on social media:</p>
  <ul>
    <li><a href="https://www.pinterest.com/Vila__g/">Pinterest</a></li>
    <li><a href="https://www.instagram.com/gvila_design/">Instagram</a></li>
  </ul>
